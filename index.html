<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>拾光 TODO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235e6ad2'/%3E%3Ccircle cx='32' cy='33' r='15' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M32 24v10l7 4' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">拾光</span>
      </div>

      <nav class="view-tabs" id="view-tabs" aria-label="视图切换">
        <button class="tab" data-view="day" type="button">日</button>
        <button class="tab" data-view="week" type="button">周</button>
        <button class="tab" data-view="month" type="button">月</button>
      </nav>

      <div class="top-actions">
        <button class="icon-btn" id="btn-today" type="button" title="回到今天 (T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
          今天
        </button>
        <button class="icon-btn" id="btn-search" type="button" title="搜索 (Ctrl+K)" aria-label="搜索 (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
          <kbd class="kbd">Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="btn-clock" type="button" title="打开置顶时钟" aria-label="打开置顶时钟">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="5.5" rx="1.2" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6.5" x2="20" y2="6.5"/><circle cx="9" cy="6.5" r="2.1" fill="var(--panel)"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.1" fill="var(--panel)"/><line x1="4" y1="17.5" x2="20" y2="17.5"/><circle cx="7" cy="17.5" r="2.1" fill="var(--panel)"/></svg>
        </button>
        <button class="icon-btn theme-toggle" id="btn-theme" type="button" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <main id="view-root" class="view-root" aria-live="polite"></main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <!-- 置顶小窗的 DOM，会被移动到 Picture-in-Picture 窗口中 -->
  <section id="clock-root" class="clock-root" hidden>
    <div class="clock-face">
      <div class="clock-time" id="clock-time">00:00</div>
      <div class="clock-meta">
        <span id="clock-date">--</span>
        <span id="clock-weekday">--</span>
      </div>
    </div>
    <div class="clock-extra" id="clock-extra">
      <div class="clock-progress">
        <span>今日</span>
        <strong id="clock-progress-text">0 / 0</strong>
      </div>
      <div class="clock-next" id="clock-next">暂无待办</div>
    </div>
    <div class="clock-controls">
      <button type="button" id="clock-collapse" class="clock-btn">收起</button>
      <button type="button" id="clock-expand" class="clock-btn" hidden>展开</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
